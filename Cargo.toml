[package]
name = "cmnp"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Moon and proto execution behind ccid cached checks"
repository = "https://git.corbet.ch/corbet-cid/cmnp.git"

[dependencies]
process-wrap = { version = "10.0", default-features = false, features = ["std", "process-group"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
